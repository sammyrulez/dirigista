[project]
name = "dirigista"
version = "0.1.0"
description = "MCP server exposing semantic classification tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dirigista"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real TypeSafe API (needs TYPESAFE_API_KEY, costs money)"]
addopts = "-m 'not live'"
